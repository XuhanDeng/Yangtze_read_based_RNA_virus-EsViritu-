# Common resources
account: "research-ceg-wm"
slurm_account: "research-ceg-wm"
regular_partition: "compute"
regular_memory: 3900 # MB

runtime: 3600 # minutes









#database
databases:
  esviritu_db_v3.2.4: "database/esviritu/v3.2.4"




#Script paths
scripts:
  checkv_clust: "scripts/checkv/aniclust.py" # cluster sequences by ANI
  checkv_ani: "scripts/checkv/anicalc.py" # calculate ANI from BLAST output
  # ref_cluster_select: "scripts/Ref_cluster_select.py" # UNUSED in Snakefile: select representative sequences (full DB)
  ref_cluster_select_assembly_only: "scripts/Ref_cluster_select_assembly_only.py" # select representatives (assembly-only DB)
  modified_esviritu: "scripts/EsViritu_modified/src/EsViritu/EsViritu.py" # EsViritu mapping pipeline
  merge_es_tsv_assembly_only: "scripts/merge_es_tsv_assembly_only.py" # merge metadata for assembly-only DB
  esviritu_rpkmf: "scripts/esviritu_rpkmf.py" # compute RPKMF per sample
  esviritu_merge_rpkmf: "scripts/esviritu_merge_rpkmf.py" # merge per-sample RPKMF tables








# Tool-specific parameters
fastp:
  threads: 24
  runtime: 3600  # minutes
  quality_threshold: 20
  length_required: 20

ribodetector:
  threads: 16
  runtime: 7200  # minutes (120 hours)
  min_length: 50
  chunk_size: 10000

spades:
  threads: 36
  spade_partition: "compute"
  spade_memory: 3900  # MB
  runtime: 7200  # minutes (120 hours)
  k_values: "21,33,55,77,101,121"


merge_esviritu_database_1:
  threads: 1
  runtime: 30  # minutes
  min_length: 200

# Select representative sequences from clustering results
ref_cluster_select:
  db_id_col: ""            # Optional: column name or 0-based index if DB is a table
  sample_order: ""         # Optional: comma-separated sample order
  sample_order_file: ""    # Optional: file with sample order
  with_cluster_id: false   # Output cluster_id as first column if true

# EsViritu mapping to final merged database
esviritu_map:
  threads: 24
  runtime: 7200  # minutes
  extra: ""  # optional extra CLI flags, e.g. "-f False"

# Correlation analysis (subspecies)
correlation:
  threads: 8
  min_samples: 10
  thresholds: "0.6,0.7,0.8,0.9"
  p_threshold: 0.1




checkv:
  threads: 24
  runtime: 7200  # minutes (120 hours)
  mem_mb_per_cpu: 3900  # MB
  slurm_partition: "compute"
  min_ani: 95
  min_coverage: 85
  min_qcov: 0


seqkit:
  threads: 24
  min_length: 1000
  nr_width: 10


#MMseq2 was used to cluster the final merged database at 95% identity and 80% coverage, but this step is optional and can be disabled if desired.In my sample, checkv is fine of the number of sequences, but if you have a very large number of sequences, you may want to cluster them with MMseqs2 before running checkv to reduce the computational load. 
mmseqs2:
  enabled: false
  threads: 24
  runtime: 7200  # minutes (120 hours)
  min_seq_id: 0.95
  coverage: 0.8
  prefix: "All1000_ESViritu"
