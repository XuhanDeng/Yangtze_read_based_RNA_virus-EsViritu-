# Common resources
account: "research-ceg-wm"
slurm_account: "research-ceg-wm"
regular_partition: "compute"
regular_memory: 3900 # MB

runtime: 3600 # minutes









#database
databases:
  ncbi_vir_reduntant: "databases/ncbi_vir_refseq/ncbi_virref_20250801.fasta"
  esviritu_db: "database/esviritu/v3.2.4/virus_pathogen_database.fna"
  esviritu_db_v3.2.4: "database/esviritu/v3.2.4"




#Script paths
scripts:
  checkv_clust: "scripts/checkv/aniclust.py"
  checkv_ani: "scripts/checkv/anicalc.py"
  ref_cluster_select: "scripts/Ref_cluster_select.py"
  modified_esviritu: "scripts/EsViritu_modified/src/EsViritu/EsViritu.py"








# Tool-specific parameters
fastp:
  threads: 24
  runtime: 3600  # minutes
  quality_threshold: 20
  length_required: 20

ribodetector:
  threads: 16
  runtime: 7200  # minutes (120 hours)
  min_length: 50
  chunk_size: 10000

spades:
  threads: 36
  spade_partition: "compute"
  spade_memory: 3900  # MB
  runtime: 7200  # minutes (120 hours)
  kmers: "21,33,55,77,101,121"
  memory: 4  # GB for spades.py -m
  k_values: "21,33,55,77,101,121"


merge_esviritu_database_1:
  threads: 1
  runtime: 30  # minutes
  min_length: 200
  esviritu_db: "database/esviritu/v3.2.4/virus_pathogen_database.fna"

# Select representative sequences from clustering results
ref_cluster_select:
  db_id_col: ""            # Optional: column name or 0-based index if DB is a table
  sample_order: ""         # Optional: comma-separated sample order
  sample_order_file: ""    # Optional: file with sample order
  with_cluster_id: false   # Output cluster_id as first column if true
  output: "results/6_esviritu/databases/cluster/cluster_representatives.txt"

# EsViritu mapping to final merged database
esviritu_map:
  db_dir: "results/6_esviritu/databases/final_merged_database"
  threads: 24
  runtime: 7200  # minutes
  extra: ""  # optional extra CLI flags, e.g. "-f False"




checkv:
  threads: 24
  runtime: 7200  # minutes (120 hours)
  mem_mb_per_cpu: 3900  # MB
  slurm_partition: "compute"
  min_ani: 95
  min_coverage: 85
  min_qcov: 0

checkv_scripts: "scripts/checkv"





seqkit:
  threads: 4
  min_length: 1000
  nr_width: 10

mmseqs2:
  threads: 24
  runtime: 7200  # minutes (120 hours)
  min_seq_id: 0.95
  coverage: 0.8
  prefix: "All1000_ESViritu"
